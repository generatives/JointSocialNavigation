# Simulator configuration
# -------------------------
# map: one of empty | default | hallway_crossing | hallway_collision |
#             narrow_hallway | narrow_hallway2 | narrow_hallway3 |
#             belief_corridor | t_junction
# Robot starting theta (orientation) is defined per-map in map.py.
map: t_junction

crowd:
  # Maximum number of humans alive simultaneously.
  max_humans: 1
  # Total spawns allowed across the whole run.  Use null for unlimited.
  max_spawns: 1
  # Average spawns per second (fractional accumulator).
  spawn_rate_per_sec: 1.0
  # Preferred walking speed range [min, max] in world units/second.
  pref_speed_min: 1.0
  pref_speed_max: 1.7

control:
  # Which planner is active at startup.
  # Options: MANUAL | ROBOT_AI | MCTS_ROBOT_AI | JOINT_ASTAR_ROBOT_AI
  default_mode: JOINT_ASTAR_ROBOT_AI

belief:
  # Angular uncertainty of the Gaussian likelihood used when a human infers
  # the robot's goal from its heading direction (radians).  Smaller values
  # make humans more decisive but more sensitive to heading noise.
  belief_sigma: 0.5
  # Minimum value of the peak belief before anticipatory forces and the
  # joint-planner discount activate.  0.5 means "human is at least 50%
  # confident about the robot's destination".
  belief_yield_threshold: 0.5
  # Seconds ahead to project the robot's position for the anticipatory
  # repulsive force.  Larger values give humans more warning time.
  belief_lookahead: 1.5
  # Factor applied to blocking_penalty in joint A* when the human has
  # already inferred the robot's goal (and will therefore yield on its own).
  # 0.5 halves the penalty, allowing the robot to plan more aggressively.
  belief_discount_blocking: 0.5

joint_astar:
  # Penalty added per step when the robot moves (prefer waiting).
  robot_move_penalty: 0.05
  # Penalty added when the human steps away from its goal.
  human_detour_penalty: 0.5
  # Base magnitude of the blocking penalty (scaled by 1/distance when
  # the robot occupies a cell on the human's shortest path).
  blocking_penalty: 2.0
  # Flat penalty added when the robot moves and would end up within
  # proximity_threshold cells of the human.  Must exceed ~3.0 to
  # discourage the robot from exiting the alcove while the human is close.
  proximity_penalty: 3.5
  # Distance threshold (cells) inside which proximity_penalty applies.
  proximity_threshold: 4
  # How often (seconds) the robot replans from its current position.
  replan_period: 0.25

sfm:
  # Human-human social repulsion: amplitude and decay length (metres).
  # Larger amplitude → humans push each other harder.
  # Larger decay → force reaches further.
  human_human_amplitude: 6.0
  human_human_decay: 0.7
  # Robot-human social repulsion (only applied when robot is blocking
  # the human's optimal path; otherwise only contact forces apply).
  robot_human_amplitude: 10.0
  robot_human_decay: 0.6
  # Obstacle repulsion: amplitude and decay length.
  obstacle_amplitude: 1.0
  obstacle_decay: 0.7

display:
  # Pixels per grid cell.  Increase for a larger window.
  cell_px: 72
  # Seconds of physics warm-up before the UI loop begins.
  warmup_seconds: 2.0
